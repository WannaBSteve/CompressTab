[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compresstab"
version = "0.1.0"
description = "Answerability-guided evidence compilation for table question answering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3", "numpy>=1.26", "pandas>=2", "nltk>=3.9", "openai>=1", "PyYAML>=6", "tokenizers>=0.20", "tabulate>=0.9"]

[project.optional-dependencies]
test = ["pytest>=8"]
evaluation = ["Babel>=2.17", "beautifulsoup4>=4.13", "inflect>=7.5", "roman>=5", "word2number>=1.1", "scipy>=1.11", "fissix>=24.4"]

[project.scripts]
compresstab = "compresstab.cli:main"

[project.urls]
Repository = "https://github.com/WannaBSteve/CompressTab"
Documentation = "https://github.com/WannaBSteve/CompressTab/tree/main/docs"
Issues = "https://github.com/WannaBSteve/CompressTab/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
